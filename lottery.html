<!DOCTYPE html>
<html>
<head>
<title>Aanni Online Lottery</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
font-family:Arial;
background:#111;
color:white;
text-align:center;
}

.number{
width:55px;
height:45px;
margin:5px;
border:none;
border-radius:8px;
background:#00c853;
color:white;
font-size:18px;
}

.popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000b;
align-items:center;
justify-content:center;
}

.box{
background:white;
color:black;
padding:25px;
border-radius:15px;
width:300px;
}

.pay{
background:#1976d2;
color:white;
padding:12px;
margin:8px;
border-radius:10px;
}

button{
cursor:pointer;
}

</style>

</head>


<body>


<h1>🎟 Aanni Online Lottery</h1>

<h3>Number filadhu</h3>


<div id="numbers"></div>



<div class="popup" id="popup">

<div class="box">

<h2>Number: <span id="selectedNumber"></span></h2>


<div class="pay" onclick="copyCBE()">
CBE: 1000323550828
<br>
📋 Copy
</div>


<div class="pay" onclick="copyAWASH()">
AWASH: 013201800201700
<br>
📋 Copy
</div>



<br>

<button onclick="sendReceipt()">
🧾 Receipt Ergi
</button>


<p id="fileName"></p>


<br>

<button onclick="closePopup()">
Cufi
</button>


</div>

</div>


<script>


const SUPABASE_URL =
"https://iwoplidjsadmgavegwws.supabase.co";


const SUPABASE_KEY =
"KEY_KEE_AS_GALCHI";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



let numbersBox =
document.getElementById("numbers");


for(let i=1;i<=100;i++){

let btn=document.createElement("button");

btn.className="number";

btn.innerHTML=i;


btn.onclick=function(){

openPopup(i);

};


numbersBox.appendChild(btn);

}



function openPopup(number){

document.getElementById("selectedNumber")
.innerHTML=number;


document.getElementById("popup")
.style.display="flex";

}



function closePopup(){

document.getElementById("popup")
.style.display="none";

}



function copyCBE(){

navigator.clipboard.writeText(
"1000323550828"
);

alert("CBE copy ta'eera");

}



function copyAWASH(){

navigator.clipboard.writeText(
"013201800201700"
);

alert("Awash copy ta'eera");

}
  // RECEIPT UPLOAD

async function sendReceipt(){

let input=document.createElement("input");

input.type="file";
input.accept="image/*";


input.onchange = async function(){


let file=input.files[0];


if(!file){
return;
}


let number =
document.getElementById("selectedNumber").innerHTML;



let fileName =
Date.now()+"_"+file.name;



// Storage upload

const {data:uploadData,error:uploadError}=await supabaseClient
.storage
.from("receipts")
.upload(fileName,file);



if(uploadError){

alert("Receipt upload hin milkoofne");

console.log(uploadError);

return;

}



// Database save

const {data,error}=await supabaseClient
.from("receipts")
.insert([

{
number:number,
file:fileName,
status:"pending"
}

]);



if(error){

alert("Database irratti rakkoo jira");

console.log(error);

return;

}



document.getElementById("fileName").innerHTML =
"✅ Receipt ergameera";


alert("Receipt Admin bira gaheera");


}



input.click();


}

</script>


</body>

</html>
